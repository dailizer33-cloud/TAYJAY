name: Build check

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify TAYJAY MAIN.lua matches src/
        run: python3 tools/build.py --check
